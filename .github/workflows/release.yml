name: Build mod dist

# Builds the whole unscience solution (every submod + the unscience umbrella
# mod) and publishes ONLY the unscience mod folder as a GitHub release:
#
#   push to main        → release    "unscience 1.<run number>.0" (keep newest 10)
#   push to feature/*   → prerelease "unscience 1.<run number>.0-beta"
#                         tags are v<version>; major is fixed at 1, patch at 0
#                         all feature branches share the 5 newest releases
#   any other ref (release/fix/chore branches, PRs into main)
#                       → build only (no release, no version stamp)
#
# The KSA reference assemblies are licensed game files and live in the private
# repo meow-sci/ksa-game-assemblies (DLLs — KSA.dll, Brutal.*.dll, Planet.*.dll
# — under current/dll/ at the repo root). Access needs the
# KSA_GAME_ASSEMBLIES_PAT repo secret: a fine-grained PAT with read-only
# Contents access to that repo (same pattern as purrtty / flexo).

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# One in-flight build per ref; a newer push supersedes an older run.
concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      channel: ${{ steps.meta.outputs.channel }}
    env:
      # Directory.Build.props resolves these before any per-OS defaults.
      KSA_DLL_DIR: ${{ github.workspace }}/.tmp/ksa-game-assemblies/current/dll
      UNSCIENCE_DIST_DIR: ${{ github.workspace }}/.tmp/dist
    steps:
      - name: Checkout unscience
        uses: actions/checkout@v6

      - name: Checkout private KSA assemblies
        uses: actions/checkout@v6
        with:
          repository: meow-sci/ksa-game-assemblies
          path: .tmp/ksa-game-assemblies
          token: ${{ secrets.KSA_GAME_ASSEMBLIES_PAT }}
          persist-credentials: false
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify release policy
        run: python3 scripts/check-release-policy.py

      # Branch-derived values are validated here and consumed by later steps
      # via env:, never interpolated raw into run scripts (a ref name can
      # contain shell/sed metacharacters; this job has contents: write).
      - name: Compute release metadata
        id: meta
        run: bash scripts/release-metadata.sh

      # The version users see in-game / in mod.toml matches the release.
      # MODVERSION is validated above to [0-9A-Za-z._-]+, so it cannot contain
      # the sed delimiter or replacement metacharacters.
      - name: Stamp mod version
        if: steps.meta.outputs.publish == 'true'
        env:
          MODVERSION: ${{ steps.meta.outputs.modversion }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$MODVERSION\"/" unscience/mod.toml
          grep '^version' unscience/mod.toml

      # Compile every project; only Unscience deploys under $UNSCIENCE_DIST_DIR.
      - name: Build solution
        run: dotnet build ksa-mod-experiments.slnx -c Release --nologo -v quiet

      - name: Validate single-mod distribution
        run: python3 scripts/check-dist.py "$UNSCIENCE_DIST_DIR"

      - name: Package
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd "$UNSCIENCE_DIST_DIR"
          test -f unscience/MeowSci.Unscience.dll
          zip -r "unscience-$VERSION.zip" unscience
          unzip -l "unscience-$VERSION.zip"

      - name: Publish release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/publish-release.sh

  prune:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cleanup is serialized per channel; beta branches share one retention pool.
    concurrency:
      group: rolling-release-cleanup-${{ needs.build.outputs.channel }}
      cancel-in-progress: false
    steps:
      - name: Checkout retention policy
        uses: actions/checkout@v6

      # Keep 10 main releases and 5 beta releases, including their legacy formats.
      # Fetch every page so retention is not capped at 200 entries.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          case "$CHANNEL" in
            main) KEEP=10 ;;
            feature) KEEP=5 ;;
            *) echo "Unknown release channel: $CHANNEL" >&2; exit 1 ;;
          esac
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 scripts/release-retention.py --channel "$CHANNEL" --keep "$KEEP" \
            > "$RUNNER_TEMP/unscience-stale-releases.txt"
          while IFS= read -r tag; do
            echo "Pruning $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < "$RUNNER_TEMP/unscience-stale-releases.txt"
